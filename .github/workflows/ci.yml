# Hosted fallback only.  The suites run on every push and PR through
# test.yml on the self-hosted runner (docs/ci.md); this workflow ran
# the core suite a second time on every event until 2026-09-06.  Keep
# it for a manual run when the self-hosted runner is down.
name: CI (hosted fallback)

on:
  workflow_dispatch:

jobs:
  offline-tests:
    name: Offline suite (SBCL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL and Quicklisp
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl curl
          curl -sSLO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
               --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'

      - name: Run the offline test suite
        run: |
          sbcl --non-interactive \
               --load ~/quicklisp/setup.lisp \
               --eval '(push (truename ".") asdf:*central-registry*)' \
               --eval '(ql:quickload :cl-llm/tests)' \
               --eval '(asdf:test-system :cl-llm)'
