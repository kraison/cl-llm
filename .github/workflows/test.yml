# The offline suites in CI (see docs/ci.md): core, rag, claims, memory,
# agent, agent/prolog, agent/mcp -- one run per push to main and per
# PR.  ci.yml is a manual hosted fallback and no longer triggers on its
# own.
name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  suites:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: engine deps at branch head
        # cl-llm's claims tests now track vivace-graph EXPERIMENT
        # (decided 2026-09-01; the floor pin failed against tests
        # that need same-day engine work).  Own dep dir -- the
        # mine-action runner shares this user, and two runners
        # refreshing one checkout would race.
        run: |
          mkdir -p ~/ci-deps-cl-llm
          for spec in "kraison vivace-graph experiment" \
                      "kraison cl-temporal-extent master" \
                      "kraison cl-mcp main" \
                      "quasi opsis main"; do
            set -- $spec
            if [ -d ~/ci-deps-cl-llm/$2/.git ]; then
              git -C ~/ci-deps-cl-llm/$2 fetch -q origin
              git -C ~/ci-deps-cl-llm/$2 checkout -qf origin/$3
            else
              git clone -q -b $3 https://github.com/$1/$2 \
                ~/ci-deps-cl-llm/$2
            fi
            echo "$2 @ $(git -C ~/ci-deps-cl-llm/$2 rev-parse --short HEAD)"
          done
      - name: core + rag + claims
        env:
          CL_LLM_ASDF_REGISTRY: $PWD/:$HOME/ci-deps-cl-llm/vivace-graph/:$HOME/ci-deps-cl-llm/cl-temporal-extent/:$HOME/ci-deps-cl-llm/cl-mcp/:$HOME/ci-deps-cl-llm/opsis/
        run: |
          sbcl --dynamic-space-size 4096 --non-interactive \
            --load "$HOME/quicklisp/setup.lisp" \
            --eval '(setf ql:*local-project-directories* nil)' \
            --eval '(asdf:initialize-source-registry
                      (list :source-registry
                            (list :tree (uiop:getcwd))
                            (list :directory
                                  (merge-pathnames
                                   "ci-deps-cl-llm/vivace-graph/"
                                   (user-homedir-pathname)))
                            (list :directory
                                  (merge-pathnames
                                   "ci-deps-cl-llm/cl-temporal-extent/"
                                   (user-homedir-pathname)))
                            (list :directory
                                  (merge-pathnames
                                   "ci-deps-cl-llm/cl-mcp/"
                                   (user-homedir-pathname)))
                            (list :directory
                                  (merge-pathnames
                                   "ci-deps-cl-llm/opsis/"
                                   (user-homedir-pathname)))
                            :ignore-inherited-configuration))' \
            --eval '(ql:quickload (list :cl-llm/tests :cl-llm/rag/tests
                                        :cl-llm/rag/claims/tests
                                        :cl-llm/memory/tests
                                        :cl-llm/agent/tests
                                        :cl-llm/agent/prolog/tests
                                        :cl-llm/agent/mcp/tests)
                                  :silent t)' \
            --eval '(asdf:test-system :cl-llm)' \
            --eval '(asdf:test-system :cl-llm/rag)' \
            --eval '(asdf:test-system :cl-llm/rag/claims)' \
            --eval '(asdf:test-system :cl-llm/memory)' \
            --eval '(asdf:test-system :cl-llm/agent)' \
            --eval '(asdf:test-system :cl-llm/agent/prolog)' \
            --eval '(asdf:test-system :cl-llm/agent/mcp)'
